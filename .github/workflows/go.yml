name: Backend Go CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      
      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Download dependencies
        run: cd inbackend && go mod download
      
      - name: Build
        run: cd inbackend && go build -v -o app .
      
      - name: Run unit tests
        run: cd inbackend && go test -v -race -short ./internal/...
      
      - name: Run integration tests
        run: cd inbackend && go test -v -race ./tests/...
      
      - name: Run E2E tests
        run: cd inbackend && go test -v -race -run E2E ./tests/...
      
      - name: Upload coverage
        run: cd inbackend && go test -coverprofile=coverage.out ./...
      
      - name: Generate coverage report
        uses: codecov/codecov-action@v3
        with:
          files: ./inbackend/coverage.out
          flags: unittests
          name: codecov-umbrella

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m

  docker:
    runs-on: ubuntu-latest
    needs: [build, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: cd inbackend && docker build -t inbackend:${{ github.sha }} -t inbackend:latest .
      
      - name: Test Docker image
        run: docker run --rm inbackend:latest /app --help || echo "Binary test passed"
