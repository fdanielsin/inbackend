name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "feature/**", "bugfix/**"]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.25.0"
  COVERAGE_THRESHOLD: 80

jobs:
  # ========== STAGE 1: LINT & FORMAT ==========
  lint:
    name: "1️⃣ Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      
      - name: "gofmt check"
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "❌ Code not formatted"
            gofmt -s -d .
            exit 1
          fi
          echo "✅ Format OK"
      
      - name: "go vet"
        run: go vet ./... && echo "✅ Vet OK"
      
      - name: "go mod tidy"
        run: |
          go mod tidy
          if [ -n "$(git diff go.mod go.sum)" ]; then
            echo "❌ go.mod/go.sum out of sync"
            exit 1
          fi
          echo "✅ Modules OK"

  # ========== STAGE 2: BUILD ==========
  build:
    name: "2️⃣ Build"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      
      - name: "Download dependencies"
        run: go mod download
      
      - name: "Build binary"
        run: |
          go build -v -o app .
          echo "✅ Build successful"

  # ========== STAGE 3: UNIT TESTS ==========
  unit-tests:
    name: "3️⃣ Unit Tests"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      
      - name: "Run unit tests"
        run: |
          go test -v -race -short ./internal/... -timeout 30s
          echo "✅ Unit tests passed"

  # ========== STAGE 4: SECURITY CHECK ==========
  security:
    name: "4️⃣ Security Check"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      
      - name: "Check for vulnerable dependencies"
        run: |
          go install github.com/sonatype-nexus-community/nancy@latest
          go list -json -m all | nancy sleuth || true
          echo "✅ Security check completed"

  # ========== STAGE 5: INTEGRATION TESTS ==========
  integration-tests:
    name: "5️⃣ Integration Tests"
    runs-on: ubuntu-latest
    needs: [unit-tests, security]
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    env:
      DATABASE_URL: "postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable"
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      
      - name: "Download dependencies"
        run: go mod download
      
      - name: "Run integration tests"
        run: |
          go test -v -race ./tests/... -timeout 60s -run '!E2E'
          echo "✅ Integration tests passed"

  # ========== STAGE 6: E2E TESTS ==========
  e2e-tests:
    name: "6️⃣ E2E Tests"
    runs-on: ubuntu-latest
    needs: [integration-tests]
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    env:
      DATABASE_URL: "postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable"
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      
      - name: "Download dependencies"
        run: go mod download
      
      - name: "Run E2E tests"
        run: |
          go test -v -race ./tests/... -timeout 60s -run 'E2E'
          echo "✅ E2E tests passed"

  # ========== STAGE 7: COVERAGE CHECK ==========
  coverage:
    name: "7️⃣ Coverage Check"
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    env:
      DATABASE_URL: "postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable"
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      
      - name: "Download dependencies"
        run: go mod download
      
      - name: "Generate coverage report"
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1
      
      - name: "Check coverage threshold"
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
            echo "⚠️  Coverage ${COVERAGE}% is below threshold of ${{ env.COVERAGE_THRESHOLD }}% (non-blocking)"
          else
            echo "✅ Coverage check passed (${COVERAGE}%)"
          fi
      
      - name: "Upload to Codecov"
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: backend
          fail_ci_if_error: false

  # ========== FINAL: SUMMARY ==========
  summary:
    name: "✅ All Checks Passed"
    runs-on: ubuntu-latest
    needs: [lint, build, unit-tests, security, integration-tests, e2e-tests, coverage]
    if: always()
    steps:
      - name: "Verify all jobs passed"
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.e2e-tests.result }}" != "success" ] || \
             [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi
          echo "🎉 All checks passed! Ready to merge"
