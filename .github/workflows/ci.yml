name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Un push plus récent sur la même branche annule le run en cours : sans cela, un run
# ancien qui finit en dernier repousserait le tag develop sur une image périmée.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  IMAGE_NAME: ghcr.io/fdanielsin/inbackend

jobs:
  # ========== STAGE 1: LINT & FORMAT ==========
  lint:
    name: "1️⃣ Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "golangci-lint and formatting"
        run: make lint

      - name: "OpenAPI lint"
        run: make lint-api

      - name: "GitHub Actions lint"
        run: make lint-ci

      - name: "go mod tidy"
        run: |
          go mod tidy
          if [ -n "$(git diff go.mod go.sum)" ]; then
            echo "❌ go.mod/go.sum out of sync"
            exit 1
          fi
          echo "✅ Modules OK"

  # ========== STAGE 2: BUILD ==========
  build:
    name: "2️⃣ Build"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      
      - name: "Download dependencies"
        run: go mod download
      
      - name: "Build binary"
        run: |
          go build -v -o app .
          echo "✅ Build successful"

  # ========== STAGE 3: UNIT TESTS ==========
  unit-tests:
    name: "3️⃣ Unit Tests"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      
      - name: "Run unit tests"
        run: |
          go test -v -race -short -shuffle=on ./tests/units/... -timeout 30s
          echo "✅ Unit tests passed"

  # ========== STAGE 4: SECURITY CHECK ==========
  security:
    name: "4️⃣ Security Check"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: "Check for vulnerable dependencies"
        run: make vuln

  # ========== STAGE 4b: DOCKER ==========
  docker:
    name: "🐳 Docker"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - name: "Build image"
        run: docker compose build

      - name: "Start stack"
        run: docker compose up -d --wait

      - name: "Check /health"
        run: curl --fail --silent --show-error http://localhost:8080/health

      - name: "Check /ready"
        run: curl --fail --silent --show-error http://localhost:8080/ready

      - name: "Check /openapi.yaml"
        run: curl --fail --silent --show-error http://localhost:8080/openapi.yaml | grep '^openapi:'

      - name: "Show logs on failure"
        if: failure()
        run: docker compose logs

      - name: "Stop stack"
        if: always()
        run: docker compose down -v

  # ========== STAGE 5: INTEGRATION TESTS ==========
  integration-tests:
    name: "5️⃣ Integration Tests"
    runs-on: ubuntu-latest
    needs: [unit-tests, security]
    
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      
      - name: "Download dependencies"
        run: go mod download
      
      - name: "Run integration tests"
        run: |
          go test -v -race -shuffle=on ./tests/integration/... -timeout 5m
          echo "✅ Integration tests passed"

  # ========== STAGE 6: E2E TESTS ==========
  e2e-tests:
    name: "6️⃣ E2E Tests"
    runs-on: ubuntu-latest
    needs: [integration-tests]
    
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      
      - name: "Download dependencies"
        run: go mod download
      
      - name: "Run E2E tests"
        run: |
          go test -v -race -shuffle=on ./tests/e2e/... -timeout 5m
          echo "✅ E2E tests passed"

  # ========== STAGE 7: COVERAGE CHECK ==========
  coverage:
    name: "7️⃣ Coverage Check"
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      
      - name: "Download dependencies"
        run: go mod download
      
      - name: "Coverage of internal/ (blocking minimum, same command as locally)"
        run: make cover

      - name: "Upload to Codecov"
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: backend
          fail_ci_if_error: false

  # ========== FINAL: SUMMARY ==========
  summary:
    name: "✅ All Checks Passed"
    runs-on: ubuntu-latest
    needs: [lint, build, unit-tests, security, docker, integration-tests, e2e-tests, coverage]
    if: always()
    steps:
      - name: "Verify all jobs passed"
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.docker.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.e2e-tests.result }}" != "success" ] || \
             [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi
          echo "🎉 All checks passed! Ready to merge"

  # ========== PUBLICATION: IMAGE GHCR ==========
  publish-image:
    name: "📦 Publish image"
    runs-on: ubuntu-latest
    needs: [summary]
    if: >-
      needs.summary.result == 'success' && github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Image tags and labels"
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=tag

      # Sans attestation (provenance, sbom) : l'image est un manifeste unique et tagué,
      # sans version sans tag que prune-image supprimerait par erreur.
      - name: "Build and push"
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ========== RÉTENTION DES VERSIONS DE L'IMAGE ==========
  prune-image:
    name: "🧹 Prune image versions"
    runs-on: ubuntu-latest
    needs: [publish-image]
    if: needs.publish-image.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Sans PRUNE_IMAGE_VERSIONS=true (variable de dépôt), le script affiche seulement
      # ce qu'il supprimerait : lire cette liste avant d'activer la suppression.
      - name: "Prune image versions"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PRUNE_IMAGE_VERSIONS: ${{ vars.PRUNE_IMAGE_VERSIONS }}
        run: scripts/prune-image-versions.sh
