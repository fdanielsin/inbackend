name: Backend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Format check
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Code not formatted"
            gofmt -s -d .
            exit 1
          fi
      - name: Build
        run: go build -v -o app .
      - name: Test
        run: go test -v -short ./internal/...
