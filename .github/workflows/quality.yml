name: Backend Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: false
      
      - name: Download dependencies
        run: go mod download
      
      - name: Format check
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Code not formatted:"
            gofmt -s -d .
            exit 1
          fi
      
      - name: Vet
        run: go vet ./...
      
      - name: Module tidy check
        run: |
          go mod tidy
          if [ -n "$(git diff go.mod go.sum)" ]; then
            echo "go.mod or go.sum out of sync"
            exit 1
          fi
      
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m
