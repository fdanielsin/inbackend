version: '3.9'

services:
  backend:
    build: .
    container_name: inbackend
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - ENV=${ENV:-development}
    volumes:
      - .:/app
    command: go run main.go
    networks:
      - innetwork

  # Optional: PostgreSQL database for future use
  postgres:
    image: postgres:16-alpine
    container_name: inbackend-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-inbackend}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - innetwork
    profiles:
      - with-db

networks:
  innetwork:
    driver: bridge

volumes:
  postgres_data:
