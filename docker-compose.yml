version: '3.9'

services:
  backend:
    build: .
    container_name: inbackend
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - ENV=${ENV:-development}
    volumes:
      - .:/app
      - app_data:/root
    command: go run main.go
    networks:
      - innetwork

networks:
  innetwork:
    driver: bridge

volumes:
  app_data:
