openapi: 3.1.0
info:
  title: InDrive Backend API
  version: 1.0.0
  description: |
    Contrat HTTP de l'API REST du backend InDrive.
    Cette spécification décrit les routes actuellement enregistrées dans
    `main.go` et leurs réponses réellement produites par les controllers.
servers:
  - url: http://localhost:8080
    description: Développement local
tags:
  - name: Health
    description: Vérification de disponibilité du service.
  - name: Users
    description: Création et consultation des utilisateurs.
  - name: Tasks
    description: Création, mise à jour, suppression et liste des tâches.
  - name: Statistics
    description: Compteurs agrégés du service.
paths:
  /health:
    get:
      tags: [Health]
      summary: Vérifier l'état du service
      operationId: healthCheck
      responses:
        '200':
          description: Service disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/users:
    get:
      tags: [Users]
      summary: Lister les utilisateurs
      operationId: listUsers
      responses:
        '200':
          description: Liste des utilisateurs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Users]
      summary: Créer un utilisateur
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Users]
      summary: Récupérer un utilisateur
      operationId: getUser
      responses:
        '200':
          description: Utilisateur trouvé
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidUserId'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Tasks]
      summary: Lister les tâches d'un utilisateur
      description: |
        Les tâches sont retournées triées par `id` croissant (ordre de
        création), garanti par le serveur.
      operationId: listUserTasks
      responses:
        '200':
          description: Liste des tâches, triée par `id` croissant.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/InvalidUserId'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/tasks:
    post:
      tags: [Tasks]
      summary: Créer une tâche
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Tâche créée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Tasks]
      summary: Mettre à jour une tâche (mise à jour partielle)
      description: |
        Met à jour une tâche existante. Chaque propriété de `UpdateTaskRequest`
        est optionnelle : une propriété absente du corps JSON n'est pas
        modifiée. Une propriété présente avec une valeur, y compris une
        valeur "vide" (`completed: false`, `description: ""`), est appliquée
        telle quelle. `title`, si présent, ne peut pas être une chaîne vide
        (voir `400`).
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Tâche mise à jour ; la réponse reflète l'état réellement persisté.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/UpdatedTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Tasks]
      summary: Supprimer une tâche
      operationId: deleteTask
      responses:
        '200':
          description: Tâche supprimée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [message]
        '400':
          $ref: '#/components/responses/InvalidTaskId'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/stats:
    get:
      tags: [Statistics]
      summary: Récupérer les statistiques
      operationId: getStats
      responses:
        '200':
          description: Statistiques agrégées
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Stats'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identifiant numérique non négatif
      schema:
        type: integer
        format: uint32
        minimum: 0
  schemas:
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data: {}
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
          format: uint32
        name:
          type: string
        email:
          type: string
    Task:
      type: object
      required: [id, title, description, user_id, completed]
      properties:
        id:
          type: integer
          format: uint32
        title:
          type: string
        description:
          type: string
        user_id:
          type: integer
          format: uint32
        completed:
          type: boolean
    UpdatedTask:
      type: object
      required: [id, title, description, completed]
      properties:
        id:
          type: integer
          format: uint32
        title:
          type: string
        description:
          type: string
        completed:
          type: boolean
    Stats:
      type: object
      required: [users, tasks]
      properties:
        users:
          type: integer
          format: int64
        tasks:
          type: integer
          format: int64
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [message, data]
          properties:
            message:
              type: string
              const: Service is healthy
            data:
              type: object
              required: [status, version, id]
              properties:
                status:
                  type: string
                  const: ok
                version:
                  type: string
                  const: 1.0.0
                id:
                  type: string
                  format: uuid
    CreateUserRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
    CreateTaskRequest:
      type: object
      required: [user_id, title]
      properties:
        user_id:
          type: integer
          format: uint32
          minimum: 1
        title:
          type: string
          minLength: 1
        description:
          type: string
        completed:
          type: boolean
          default: false
    UpdateTaskRequest:
      type: object
      description: |
        Toutes les propriétés sont optionnelles. Une propriété absente du
        corps JSON laisse la valeur existante inchangée en base ; une
        propriété présente est appliquée telle quelle, y compris une valeur
        "vide" (`false`, `""`).
      properties:
        title:
          type: string
          minLength: 1
          description: Si fourni, ne peut pas être une chaîne vide (400 sinon).
        description:
          type: string
        completed:
          type: boolean
  responses:
    BadRequest:
      description: Requête invalide ou erreur de validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidUserId:
      description: Identifiant utilisateur invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidTaskId:
      description: Identifiant tâche invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UserNotFound:
      description: Utilisateur introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TaskNotFound:
      description: Tâche introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Erreur interne; les détails techniques ne sont pas exposés
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
