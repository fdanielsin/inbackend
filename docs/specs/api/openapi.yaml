openapi: 3.1.0
info:
  title: InDrive Backend API
  version: 1.3.0
  description: |
    Contrat HTTP de l'API REST du backend InDrive.
    Cette spécification décrit les routes actuellement enregistrées dans
    `internal/app/router.go` et leurs réponses réellement produites par les controllers.

    Règles valables pour toutes les routes, non répétées opération par opération :
    - toute réponse porte l'en-tête `X-Request-Id` (l'identifiant envoyé par le
      client est repris s'il est composé de 1 à 64 caractères parmi
      `A-Za-z0-9._-`, sinon le serveur en génère un) ;
    - toute réponse, erreurs, préappel CORS et réponse à HEAD compris, porte
      l'en-tête `X-Content-Type-Options: nosniff` : le navigateur ne doit pas
      deviner un autre type que celui annoncé ;
    - une route inconnue répond `404` `ROUTE_NOT_FOUND` et une méthode non
      supportée sur une route connue répond `405` `METHOD_NOT_ALLOWED` (avec
      l'en-tête `Allow`), tous deux dans l'enveloppe d'erreur ;
    - HEAD est accepté sur toute route GET et répond comme elle, sans corps
      (RFC 9110, section 9.3.2) ;
    - un corps de requête de plus de 1 MiB (1 048 576 octets) répond `413`
      `PAYLOAD_TOO_LARGE` ;
    - un corps JSON de requête qui contient une propriété que le schéma ne
      déclare pas, ou `null` pour une propriété facultative, répond `400`
      `INVALID_BODY` ; une valeur texte plus longue que
      `maxLength`, ou un nombre au-dessus de `maximum`, répond `400`
      `VALIDATION_FAILED`. La longueur compte les
      caractères Unicode (points de code) de la valeur reçue, avant le retrait
      des espaces de début et de fin. Les réponses, elles, peuvent gagner des
      propriétés sans changer de version.

    Langue des messages : le serveur parle deux langues, l'anglais (par défaut)
    et le français. Si l'en-tête `Accept-Language` demande le français
    (`fr`, `fr-FR`, `fr-CA`, toute variante de `fr`), les textes `message` et
    `error` sont en français ; pour toute autre langue, un en-tête absent ou
    invalide, ils sont en anglais, sans jamais répondre `400`. Quand plusieurs
    langues sont demandées, la préférence `q` la plus haute l'emporte (RFC 9110).
    Chaque réponse porte `Content-Language` (`en` ou `fr`) et
    `Vary: Accept-Language`. Les codes `error_code` et les valeurs machine
    (par exemple `status`) ne dépendent pas de la langue.
servers:
  - url: /
    description: Même origine que cette documentation
  - url: http://localhost:8080
    description: Développement local
tags:
  - name: Root
    description: Sommaire de l'API, à la racine.
  - name: Health
    description: Vérification de disponibilité du service.
  - name: Users
    description: Création, consultation, renommage et suppression des utilisateurs.
  - name: Tasks
    description: Création, mise à jour, suppression et liste des tâches.
  - name: Statistics
    description: Compteurs agrégés du service.
  - name: Documentation
    description: |
      Contrat et interface Swagger UI. Ces routes n'existent que si
      `API_DOCS_ENABLED` les active (par défaut hors production) ; sinon elles
      répondent `404` `ROUTE_NOT_FOUND`.
paths:
  /:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [Root]
      summary: Afficher le sommaire de l'API
      description: |
        Accueille et oriente : renvoie le nom de l'API, sa version et des liens
        vers les routes publiques. Ne lit pas la base de données : elle répond
        même quand `/ready` répond `503`.
        Les liens sont des chemins depuis la racine, jamais construits à partir
        de la requête (`Host`, `X-Forwarded-*`). `docs` et `openapi` sont
        absents quand la documentation est désactivée (`API_DOCS_ENABLED`),
        pour ne jamais pointer vers une `404`. Les paramètres de requête sont
        ignorés. Seul le `message` dépend de `Accept-Language` ; `data` est
        identique dans toutes les langues. `data` ne contient aucun autre champ
        que ceux du schéma. Les chemins `/api` et `/api/v1` restent `404`.
        La réponse n'est jamais mise en cache (`Cache-Control: no-store`).
      operationId: getApiSummary
      responses:
        '200':
          description: Sommaire de l'API
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSummaryResponse'
    head:
      tags: [Root]
      summary: Afficher le sommaire de l'API, sans corps
      description: Répond comme `GET /`, sans corps (RFC 9110, section 9.3.2).
      operationId: getApiSummaryHead
      responses:
        '200':
          description: Sommaire de l'API (sans corps)
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
  /health:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [Health]
      summary: Vérifier que le service est vivant
      description: |
        Sonde de vivacité : répond tant que le processus sert des requêtes, sans
        interroger la base de données. Pour savoir si le service peut répondre
        aux requêtes métier, utiliser `/ready`.
        La réponse n'est jamais mise en cache (`Cache-Control: no-store`).
      operationId: healthCheck
      responses:
        '200':
          description: Service disponible
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
    head:
      tags: [Health]
      summary: Vérifier que le service est vivant, sans corps
      description: Répond comme `GET /health`, sans corps (RFC 9110, section 9.3.2).
      operationId: healthCheckHead
      responses:
        '200':
          description: Service disponible
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
  /ready:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [Health]
      summary: Vérifier que le service est prêt
      description: |
        Sonde de disponibilité : vérifie que la base de données répond (délai
        maximal de 2 secondes). Répond `503` `DATABASE_UNAVAILABLE`, sans
        détail technique, sinon. Les réponses ne sont jamais mises en cache
        (`Cache-Control: no-store`).
      operationId: readinessCheck
      responses:
        '200':
          description: Service prêt
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    head:
      tags: [Health]
      summary: Vérifier que le service est prêt, sans corps
      description: Répond comme `GET /ready`, sans corps (RFC 9110, section 9.3.2).
      operationId: readinessCheckHead
      responses:
        '200':
          description: Service prêt
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '503':
          $ref: '#/components/responses/HeadDatabaseUnavailable'
  /api/v1/users:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [Users]
      summary: Lister les utilisateurs
      description: |
        Les utilisateurs sont retournés triés par `id` croissant (ordre de
        création), garanti par le serveur.
      operationId: listUsers
      responses:
        '200':
          description: Liste des utilisateurs
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Users]
      summary: Créer un utilisateur
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Utilisateur créé
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/EmailTaken'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
    head:
      tags: [Users]
      summary: Lister les utilisateurs, sans corps
      description: Répond comme `GET /api/v1/users`, sans corps (RFC 9110, section 9.3.2).
      operationId: listUsersHead
      responses:
        '200':
          description: Liste des utilisateurs
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
        '500':
          $ref: '#/components/responses/HeadInternalServerError'
  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [Users]
      summary: Récupérer un utilisateur
      operationId: getUser
      responses:
        '200':
          description: Utilisateur trouvé
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidUserId'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    head:
      tags: [Users]
      summary: Récupérer un utilisateur, sans corps
      description: Répond comme `GET /api/v1/users/{id}`, sans corps (RFC 9110, section 9.3.2).
      operationId: getUserHead
      responses:
        '200':
          description: Utilisateur trouvé
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
        '400':
          $ref: '#/components/responses/HeadInvalidUserId'
        '404':
          $ref: '#/components/responses/HeadUserNotFound'
        '500':
          $ref: '#/components/responses/HeadInternalServerError'
    put:
      tags: [Users]
      summary: Modifier le nom d'un utilisateur
      description: |
        Remplace le nom d'un utilisateur existant, avec les règles de la
        création (espaces de début et de fin retirés, non vide, 100 caractères
        au plus comptés avant le retrait). `name` est obligatoire : un corps
        `{}` ou `{"name": null}` répond `400` `VALIDATION_FAILED`. L'e-mail
        et l'identifiant ne sont pas modifiables : une propriété autre que
        `name` (dont `email` et `id`, quelle qu'en soit la casse) répond `400`
        `INVALID_BODY` avant tout accès à la base. Le corps est vérifié avant
        l'identifiant. Un utilisateur absent n'est jamais recréé : `404`.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Utilisateur modifié ; la réponse reflète l'état réellement persisté.
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidBodyOrUserId'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Users]
      summary: Supprimer un utilisateur et ses tâches
      description: |
        Supprime l'utilisateur et toutes ses tâches en une seule opération de
        la base : ou bien tout disparaît, ou bien rien ne change. Répond `404`
        si l'utilisateur n'existe pas ou a déjà été supprimé : la suppression
        n'est donc pas idempotente côté statut HTTP. Le message ne contient ni
        nom ni e-mail.
      operationId: deleteUser
      responses:
        '200':
          description: Utilisateur et tâches supprimés
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [message]
                    properties:
                      message:
                        type: string
        '400':
          $ref: '#/components/responses/InvalidUserId'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/CompletedFilter'
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [Tasks]
      summary: Lister les tâches d'un utilisateur
      description: |
        Les tâches sont retournées triées par `id` croissant (ordre de
        création), garanti par le serveur. Le paramètre `completed` ne garde
        que les tâches terminées (`true`) ou non terminées (`false`) ; absent,
        toutes les tâches sont retournées.
      operationId: listUserTasks
      responses:
        '200':
          description: Liste des tâches, triée par `id` croissant.
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/InvalidUserIdOrCompletedFilter'
        '500':
          $ref: '#/components/responses/InternalServerError'
    head:
      tags: [Tasks]
      summary: Lister les tâches d'un utilisateur, sans corps
      description: Répond comme `GET /api/v1/users/{id}/tasks`, y compris avec `completed`, sans corps (RFC 9110, section 9.3.2).
      operationId: listUserTasksHead
      responses:
        '200':
          description: Liste des tâches
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
        '400':
          $ref: '#/components/responses/HeadInvalidUserIdOrCompletedFilter'
        '500':
          $ref: '#/components/responses/HeadInternalServerError'
  /api/v1/tasks:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      tags: [Tasks]
      summary: Créer une tâche
      description: |
        Répond `404` `USER_NOT_FOUND` si `user_id` ne correspond à aucun
        utilisateur : une tâche appartient toujours à un utilisateur existant
        (clé étrangère en base).
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Tâche créée
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/AcceptLanguage'
    put:
      tags: [Tasks]
      summary: Mettre à jour une tâche (mise à jour partielle)
      description: |
        Met à jour une tâche existante. Chaque propriété de `UpdateTaskRequest`
        est optionnelle : une propriété absente du corps JSON n'est pas
        modifiée. Une propriété présente est appliquée, y compris
        `completed: false` et `description: ""`, après retrait des espaces de
        début et de fin des textes ; `null` est refusé. `title`, si présent, ne
        peut être ni vide ni fait d'espaces (voir `400`).
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Tâche mise à jour ; la réponse reflète l'état réellement persisté.
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/UpdatedTask'
        '400':
          $ref: '#/components/responses/InvalidBodyOrTaskId'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Tasks]
      summary: Supprimer une tâche
      description: |
        Répond `404` si la tâche n'existe pas ou a déjà été supprimée : la
        suppression n'est donc pas idempotente côté statut HTTP.
      operationId: deleteTask
      responses:
        '200':
          description: Tâche supprimée
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [message]
                    properties:
                      message:
                        type: string
        '400':
          $ref: '#/components/responses/InvalidTaskId'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/stats:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [Statistics]
      summary: Récupérer les statistiques
      operationId: getStats
      responses:
        '200':
          description: Statistiques agrégées
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Stats'
        '500':
          $ref: '#/components/responses/InternalServerError'
    head:
      tags: [Statistics]
      summary: Récupérer les statistiques, sans corps
      description: Répond comme `GET /api/v1/stats`, sans corps (RFC 9110, section 9.3.2).
      operationId: getStatsHead
      responses:
        '200':
          description: Statistiques agrégées
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/Vary'
        '500':
          $ref: '#/components/responses/HeadInternalServerError'
  /openapi.yaml:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [Documentation]
      summary: Télécharger le contrat OpenAPI
      description: |
        Renvoie ce fichier tel qu'il est embarqué dans le binaire. Il est en français
        (`Content-Language: fr`), quelle que soit la valeur de `Accept-Language`.
        Disponible seulement si `API_DOCS_ENABLED` est actif.
      operationId: getOpenApiContract
      responses:
        '200':
          description: Contrat OpenAPI au format YAML
          headers:
            Content-Language:
              description: Langue du contenu (descriptions du contrat), indépendante de `Accept-Language`.
              schema:
                type: string
                const: fr
            Vary:
              $ref: '#/components/headers/Vary'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
          content:
            application/yaml:
              schema:
                type: object
                description: Document OpenAPI 3.1 (ce fichier).
    head:
      tags: [Documentation]
      summary: Télécharger le contrat OpenAPI, sans corps
      description: Répond comme `GET /openapi.yaml`, sans corps (RFC 9110, section 9.3.2).
      operationId: getOpenApiContractHead
      responses:
        '200':
          description: Contrat OpenAPI (sans corps)
          headers:
            Content-Language:
              description: Langue du contenu (descriptions du contrat), indépendante de `Accept-Language`.
              schema:
                type: string
                const: fr
            Vary:
              $ref: '#/components/headers/Vary'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
  /docs:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [Documentation]
      summary: Afficher l'interface Swagger UI
      description: |
        Page HTML qui charge Swagger UI depuis un CDN (version épinglée,
        intégrité vérifiée) et affiche `/openapi.yaml`. La page est en anglais
        (`Content-Language: en`), quelle que soit la valeur de `Accept-Language`.
        Disponible seulement si
        `API_DOCS_ENABLED` est actif. Une politique `Content-Security-Policy`
        limite la page à ce CDN et à cette origine.
      operationId: getSwaggerUi
      responses:
        '200':
          description: Page Swagger UI
          headers:
            Content-Language:
              description: Langue de la page (interface Swagger UI), indépendante de `Accept-Language`.
              schema:
                type: string
                const: en
            Vary:
              $ref: '#/components/headers/Vary'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
            Content-Security-Policy:
              description: Politique limitant la page à son origine et au CDN de Swagger UI.
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
    head:
      tags: [Documentation]
      summary: Afficher l'interface Swagger UI, sans corps
      description: Répond comme `GET /docs`, sans corps (RFC 9110, section 9.3.2).
      operationId: getSwaggerUiHead
      responses:
        '200':
          description: Page Swagger UI (sans corps)
          headers:
            Content-Language:
              description: Langue de la page (interface Swagger UI), indépendante de `Accept-Language`.
              schema:
                type: string
                const: en
            Vary:
              $ref: '#/components/headers/Vary'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
            Content-Security-Policy:
              description: Politique limitant la page à son origine et au CDN de Swagger UI.
              schema:
                type: string
components:
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        Langue des messages : le français pour `fr` et ses variantes, l'anglais
        sinon. Chaque élément doit respecter la RFC 9110 (plage de langue avec
        tirets, `q` de 0 à 1) : un élément invalide, un en-tête absent ou de plus
        de 1024 octets donnent l'anglais, jamais une erreur. Voir la description
        de l'API.
      schema:
        type: string
        maxLength: 1024
        examples: ['fr-FR,fr;q=0.9,en;q=0.8']
    Id:
      name: id
      in: path
      required: true
      description: Identifiant numérique non négatif
      schema:
        type: integer
        format: uint32
        minimum: 0
    CompletedFilter:
      name: completed
      in: query
      required: false
      description: |
        Filtre sur l'état des tâches : `true` pour les tâches terminées,
        `false` pour les autres ; absent, aucun filtre. Seules les valeurs
        exactes `true` et `false` (en minuscules) sont acceptées : toute autre
        valeur (`True`, `1`, `yes`, valeur vide), ou un paramètre répété, donne
        400 `VALIDATION_FAILED`. Un paramètre de requête inconnu est ignoré.
      schema:
        type: boolean
  schemas:
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
          description: Texte lisible et localisé, destiné à l'affichage ; ne pas le comparer.
        data: {}
    ErrorResponse:
      type: object
      required: [success, error, error_code]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
          description: Message lisible et localisé, destiné à l'affichage ; sa formulation peut évoluer.
        error_code:
          $ref: '#/components/schemas/ErrorCode'
    ErrorCode:
      type: string
      description: |
        Code d'erreur stable, à utiliser pour décider du comportement d'un
        client (le message `error` ne doit pas être comparé). Les codes
        existants ne changent ni de nom ni de sens ; de nouveaux codes
        peuvent être ajoutés.
      enum:
        - INVALID_BODY
        - INVALID_ID
        - VALIDATION_FAILED
        - USER_NOT_FOUND
        - TASK_NOT_FOUND
        - EMAIL_TAKEN
        - ROUTE_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - PAYLOAD_TOO_LARGE
        - DATABASE_UNAVAILABLE
        - INTERNAL_ERROR
      x-enumDescriptions:
        INVALID_BODY: Corps JSON absent, mal formé, de mauvais type ou contenant une propriété inconnue, dont `email` ou `id` à la modification d'un utilisateur (400).
        INVALID_ID: Identifiant de chemin non numérique ou hors de la plage uint32 (400).
        VALIDATION_FAILED: Règle de validation violée (titre, nom ou email vide ou fait d'espaces, format d'email invalide, user_id absent, valeur trop longue, valeur invalide du paramètre `completed`) ; `error` précise laquelle (400).
        USER_NOT_FOUND: Utilisateur introuvable (404).
        TASK_NOT_FOUND: Tâche introuvable (404).
        EMAIL_TAKEN: Un utilisateur avec cet email (une fois normalisé) existe déjà (409).
        ROUTE_NOT_FOUND: Route inconnue (404).
        METHOD_NOT_ALLOWED: Méthode non supportée sur cette route (405).
        PAYLOAD_TOO_LARGE: Corps de requête de plus de 1 MiB (413).
        DATABASE_UNAVAILABLE: La base de données ne répond pas (503, `/ready` seulement).
        INTERNAL_ERROR: Erreur serveur, détails non exposés (500).
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
          format: uint32
        name:
          type: string
        email:
          type: string
    Task:
      type: object
      required: [id, title, description, user_id, completed]
      properties:
        id:
          type: integer
          format: uint32
        title:
          type: string
        description:
          type: string
        user_id:
          type: integer
          format: uint32
        completed:
          type: boolean
    UpdatedTask:
      type: object
      required: [id, title, description, completed]
      properties:
        id:
          type: integer
          format: uint32
        title:
          type: string
        description:
          type: string
        completed:
          type: boolean
    Stats:
      type: object
      required: [users, tasks]
      properties:
        users:
          type: integer
          minimum: 0
        tasks:
          type: integer
          minimum: 0
    ApiSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [message, data]
          properties:
            message:
              type: string
              examples: [Welcome to the InDrive Backend API]
            data:
              type: object
              additionalProperties: false
              required: [name, version, links]
              properties:
                name:
                  type: string
                  const: InDrive Backend API
                version:
                  type: string
                  description: Même valeur que `data.version` de `/health` et `info.version` de ce contrat.
                  examples: [1.3.0]
                links:
                  type: object
                  additionalProperties: false
                  required: [health, ready]
                  properties:
                    docs:
                      type: string
                      const: /docs
                      description: Absent quand la documentation est désactivée.
                    openapi:
                      type: string
                      const: /openapi.yaml
                      description: Absent quand la documentation est désactivée.
                    health:
                      type: string
                      const: /health
                    ready:
                      type: string
                      const: /ready
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [message, data]
          properties:
            message:
              type: string
              examples: [Service is healthy]
            data:
              type: object
              required: [status, version, id]
              properties:
                status:
                  type: string
                  const: ok
                version:
                  type: string
                  examples: [1.3.0]
                id:
                  type: string
                  format: uuid
    ReadyResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [message, data]
          properties:
            message:
              type: string
              examples: [Service is ready]
            data:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  const: ready
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Espaces de début et de fin retirés ; un nom fait d'espaces est refusé (400 `VALIDATION_FAILED`).
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: |
            Normalisé par le serveur : espaces de début et de fin retirés,
            minuscules. L'email renvoyé est la forme normalisée, et l'unicité
            porte sur elle (`A@x.io` après `a@x.io` : 409 `EMAIL_TAKEN`).
            Format contrôlé sur la forme normalisée (pas la RFC 5322 complète),
            sinon 400 `VALIDATION_FAILED`. Longueurs en caractères Unicode.
            Règle exacte, à appliquer à l'identique côté client :

            - aucun espace ni caractère de contrôle ;
            - un seul `@` ;
            - partie locale de 1 à 64 caractères, sans point au début ni à la
              fin et sans deux points consécutifs (`.q@b.co`, `q.@b.co` et
              `q..x@b.co` sont refusés, `q.x@b.co` accepté) ;
            - domaine d'au moins deux labels séparés par des points ;
            - chaque label fait de 1 à 63 caractères : lettres (Unicode
              admis, `\p{L}`), signes combinants (`\p{M}`, pour les alphabets
              qui en ont besoin), chiffres (`\p{Nd}`) et tiret `-`, sans tiret
              au début ni à la fin (donc pas de `_`) ;
            - dernier label (TLD) : soit 2 à 24 lettres Unicode
              (`\p{L}` et `\p{M}`, premier caractère une lettre ; ni chiffre
              ni tiret), soit la forme punycode `xn--` suivie d'au moins un
              caractère, 24 caractères au plus au total.

            Acceptés : `ada@exemple.fr`, `ivan@пример.рф`, `a@b.co`,
            `a@b.xn--p1ai`. Refusés : `a@b.c` (TLD d'un caractère),
            `a@b_c.com` (`_`), `a@-b.com` et `a@b-.com` (tiret au bord),
            `a@b.c0m` (chiffre dans le TLD), une partie locale de 65
            caractères, un label de 64 caractères, un TLD de 25 lettres.
            Un email vide ou composé d'espaces est aussi refusé.
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Espaces de début et de fin retirés ; un nom vide ou fait d'espaces est refusé (400 `VALIDATION_FAILED`).
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [user_id, title]
      properties:
        user_id:
          type: integer
          format: uint32
          minimum: 1
          maximum: 4294967295
          description: Au-delà du maximum, 400 `VALIDATION_FAILED`.
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Espaces de début et de fin retirés ; un titre fait d'espaces est refusé (400 `VALIDATION_FAILED`).
        description:
          type: string
          maxLength: 2000
          description: Espaces de début et de fin retirés ; une description faite d'espaces devient `""`.
        completed:
          type: boolean
          default: false
    UpdateTaskRequest:
      type: object
      additionalProperties: false
      description: |
        Toutes les propriétés sont optionnelles. Une propriété absente du
        corps JSON laisse la valeur existante inchangée en base ; une
        propriété présente est appliquée, y compris `false` pour `completed` et
        une description vide (`""`) ou faite d'espaces, qui devient `""`.
        `null` est refusé (400 `INVALID_BODY`), de même qu'un titre vide ou
        fait d'espaces (400 `VALIDATION_FAILED`).
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Si fourni, ne peut être ni vide ni fait d'espaces (400 sinon) ; espaces de début et de fin retirés.
        description:
          type: string
          maxLength: 2000
          description: Espaces de début et de fin retirés ; une description faite d'espaces devient `""`.
        completed:
          type: boolean
  headers:
    ContentLanguage:
      description: Langue des textes de la réponse.
      schema:
        type: string
        enum: [en, fr]
    Vary:
      description: La réponse dépend de la langue demandée.
      schema:
        type: string
        const: Accept-Language
    ContentTypeOptionsNoSniff:
      description: Interdit au navigateur de deviner le type du contenu.
      schema:
        type: string
        const: nosniff
    CacheControlNoStore:
      description: Interdit toute mise en cache de la réponse (sondes et sommaire de la racine).
      schema:
        type: string
        const: no-store
  responses:
    DatabaseUnavailable:
      description: La base de données ne répond pas (`DATABASE_UNAVAILABLE`)
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Corps invalide (`INVALID_BODY`) ou erreur de validation (`VALIDATION_FAILED`)
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidBodyOrTaskId:
      description: |
        Corps invalide (`INVALID_BODY`), erreur de validation
        (`VALIDATION_FAILED`) ou identifiant de tâche invalide (`INVALID_ID`) ;
        le corps est vérifié avant l'identifiant, donc un corps invalide sur un
        identifiant invalide donne `INVALID_BODY`
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidUserId:
      description: Identifiant utilisateur invalide (`INVALID_ID`)
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidBodyOrUserId:
      description: |
        Corps invalide (`INVALID_BODY`), erreur de validation
        (`VALIDATION_FAILED`) ou identifiant utilisateur invalide
        (`INVALID_ID`) ; le corps est vérifié avant l'identifiant, donc un
        corps invalide sur un identifiant invalide donne `INVALID_BODY`
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidUserIdOrCompletedFilter:
      description: |
        Identifiant utilisateur invalide (`INVALID_ID`) ou valeur invalide du
        paramètre `completed` (`VALIDATION_FAILED`) ; l'identifiant est vérifié
        en premier
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidTaskId:
      description: Identifiant tâche invalide (`INVALID_ID`)
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UserNotFound:
      description: Utilisateur introuvable (`USER_NOT_FOUND`)
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TaskNotFound:
      description: Tâche introuvable (`TASK_NOT_FOUND`)
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    EmailTaken:
      description: Un utilisateur avec cet email existe déjà (`EMAIL_TAKEN`)
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Corps de requête de plus de 1 MiB (`PAYLOAD_TOO_LARGE`)
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Erreur interne (`INTERNAL_ERROR`) ; les détails techniques ne sont pas exposés
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HeadDatabaseUnavailable:
      description: Base de données indisponible (`DATABASE_UNAVAILABLE`), sans corps
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    HeadInvalidUserId:
      description: Identifiant utilisateur invalide (`INVALID_ID`), sans corps
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
    HeadInvalidUserIdOrCompletedFilter:
      description: |
        Identifiant utilisateur invalide (`INVALID_ID`) ou valeur invalide du
        paramètre `completed` (`VALIDATION_FAILED`), sans corps
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
    HeadUserNotFound:
      description: Utilisateur introuvable (`USER_NOT_FOUND`), sans corps
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
    HeadInternalServerError:
      description: Erreur interne (`INTERNAL_ERROR`), sans corps
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/Vary'
