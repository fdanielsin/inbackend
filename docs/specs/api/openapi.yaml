openapi: 3.1.0
info:
  title: InDrive Backend API
  version: 1.0.0
  description: |
    Contrat HTTP de l'API REST du backend InDrive.
    Cette spécification décrit les routes actuellement enregistrées dans
    `internal/app/router.go` et leurs réponses réellement produites par les controllers.

    Règles valables pour toutes les routes, non répétées opération par opération :
    - toute réponse porte l'en-tête `X-Request-Id` (l'identifiant envoyé par le
      client est repris s'il est composé de 1 à 64 caractères parmi
      `A-Za-z0-9._-`, sinon le serveur en génère un) ;
    - une route inconnue répond `404` `ROUTE_NOT_FOUND` et une méthode non
      supportée sur une route connue répond `405` `METHOD_NOT_ALLOWED` (avec
      l'en-tête `Allow`), tous deux dans l'enveloppe d'erreur ;
    - un corps de requête de plus de 1 MiB (1 048 576 octets) répond `413`
      `PAYLOAD_TOO_LARGE`.
servers:
  - url: http://localhost:8080
    description: Développement local
tags:
  - name: Health
    description: Vérification de disponibilité du service.
  - name: Users
    description: Création et consultation des utilisateurs.
  - name: Tasks
    description: Création, mise à jour, suppression et liste des tâches.
  - name: Statistics
    description: Compteurs agrégés du service.
paths:
  /health:
    get:
      tags: [Health]
      summary: Vérifier l'état du service
      operationId: healthCheck
      responses:
        '200':
          description: Service disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/users:
    get:
      tags: [Users]
      summary: Lister les utilisateurs
      operationId: listUsers
      responses:
        '200':
          description: Liste des utilisateurs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Users]
      summary: Créer un utilisateur
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/EmailTaken'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Users]
      summary: Récupérer un utilisateur
      operationId: getUser
      responses:
        '200':
          description: Utilisateur trouvé
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidUserId'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Tasks]
      summary: Lister les tâches d'un utilisateur
      description: |
        Les tâches sont retournées triées par `id` croissant (ordre de
        création), garanti par le serveur.
      operationId: listUserTasks
      responses:
        '200':
          description: Liste des tâches, triée par `id` croissant.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/InvalidUserId'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/tasks:
    post:
      tags: [Tasks]
      summary: Créer une tâche
      description: |
        Répond `404` `USER_NOT_FOUND` si `user_id` ne correspond à aucun
        utilisateur : une tâche appartient toujours à un utilisateur existant
        (clé étrangère en base).
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Tâche créée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Tasks]
      summary: Mettre à jour une tâche (mise à jour partielle)
      description: |
        Met à jour une tâche existante. Chaque propriété de `UpdateTaskRequest`
        est optionnelle : une propriété absente du corps JSON n'est pas
        modifiée. Une propriété présente avec une valeur, y compris une
        valeur "vide" (`completed: false`, `description: ""`), est appliquée
        telle quelle. `title`, si présent, ne peut pas être une chaîne vide
        (voir `400`).
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Tâche mise à jour ; la réponse reflète l'état réellement persisté.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/UpdatedTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Tasks]
      summary: Supprimer une tâche
      description: |
        Répond `404` si la tâche n'existe pas ou a déjà été supprimée : la
        suppression n'est donc pas idempotente côté statut HTTP.
      operationId: deleteTask
      responses:
        '200':
          description: Tâche supprimée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [message]
        '400':
          $ref: '#/components/responses/InvalidTaskId'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/stats:
    get:
      tags: [Statistics]
      summary: Récupérer les statistiques
      operationId: getStats
      responses:
        '200':
          description: Statistiques agrégées
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Stats'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identifiant numérique non négatif
      schema:
        type: integer
        format: uint32
        minimum: 0
  schemas:
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data: {}
    ErrorResponse:
      type: object
      required: [success, error, error_code]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
          description: Message lisible, destiné à l'affichage ; sa formulation peut évoluer.
        error_code:
          $ref: '#/components/schemas/ErrorCode'
    ErrorCode:
      type: string
      description: |
        Code d'erreur stable, à utiliser pour décider du comportement d'un
        client (le message `error` ne doit pas être comparé). Les codes
        existants ne changent ni de nom ni de sens ; de nouveaux codes
        peuvent être ajoutés.
      enum:
        - INVALID_BODY
        - INVALID_ID
        - VALIDATION_FAILED
        - USER_NOT_FOUND
        - TASK_NOT_FOUND
        - EMAIL_TAKEN
        - ROUTE_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - PAYLOAD_TOO_LARGE
        - INTERNAL_ERROR
      x-enumDescriptions:
        INVALID_BODY: Corps JSON absent, mal formé ou de mauvais type (400).
        INVALID_ID: Identifiant de chemin non numérique ou hors de la plage uint32 (400).
        VALIDATION_FAILED: Règle de validation violée (titre, nom ou email vide, format d'email invalide, user_id absent) ; `error` précise laquelle (400).
        USER_NOT_FOUND: Utilisateur introuvable (404).
        TASK_NOT_FOUND: Tâche introuvable (404).
        EMAIL_TAKEN: Un utilisateur avec cet email (une fois normalisé) existe déjà (409).
        ROUTE_NOT_FOUND: Route inconnue (404).
        METHOD_NOT_ALLOWED: Méthode non supportée sur cette route (405).
        PAYLOAD_TOO_LARGE: Corps de requête de plus de 1 MiB (413).
        INTERNAL_ERROR: Erreur serveur, détails non exposés (500).
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
          format: uint32
        name:
          type: string
        email:
          type: string
    Task:
      type: object
      required: [id, title, description, user_id, completed]
      properties:
        id:
          type: integer
          format: uint32
        title:
          type: string
        description:
          type: string
        user_id:
          type: integer
          format: uint32
        completed:
          type: boolean
    UpdatedTask:
      type: object
      required: [id, title, description, completed]
      properties:
        id:
          type: integer
          format: uint32
        title:
          type: string
        description:
          type: string
        completed:
          type: boolean
    Stats:
      type: object
      required: [users, tasks]
      properties:
        users:
          type: integer
          format: int64
        tasks:
          type: integer
          format: int64
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [message, data]
          properties:
            message:
              type: string
              const: Service is healthy
            data:
              type: object
              required: [status, version, id]
              properties:
                status:
                  type: string
                  const: ok
                version:
                  type: string
                  const: 1.0.0
                id:
                  type: string
                  format: uuid
    CreateUserRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
          description: |
            Normalisé par le serveur : espaces de début et de fin retirés,
            minuscules. L'email renvoyé est la forme normalisée, et l'unicité
            porte sur elle (`A@x.io` après `a@x.io` : 409 `EMAIL_TAKEN`).
            Format minimal (pas la RFC 5322), sinon 400 `VALIDATION_FAILED` :
            un seul `@`, une partie locale non vide, un domaine d'au moins
            deux labels non vides séparés par des points (`a@.c`, `a@b.` et
            `a@b..c` sont refusés), et aucun espace ni caractère de contrôle
            (après retrait des espaces de début et de fin). Un email vide ou
            composé d'espaces est aussi refusé.
    CreateTaskRequest:
      type: object
      required: [user_id, title]
      properties:
        user_id:
          type: integer
          format: uint32
          minimum: 1
        title:
          type: string
          minLength: 1
        description:
          type: string
        completed:
          type: boolean
          default: false
    UpdateTaskRequest:
      type: object
      description: |
        Toutes les propriétés sont optionnelles. Une propriété absente du
        corps JSON laisse la valeur existante inchangée en base ; une
        propriété présente est appliquée telle quelle, y compris une valeur
        "vide" (`false`, `""`).
      properties:
        title:
          type: string
          minLength: 1
          description: Si fourni, ne peut pas être une chaîne vide (400 sinon).
        description:
          type: string
        completed:
          type: boolean
  responses:
    BadRequest:
      description: Corps invalide (`INVALID_BODY`) ou erreur de validation (`VALIDATION_FAILED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidUserId:
      description: Identifiant utilisateur invalide (`INVALID_ID`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidTaskId:
      description: Identifiant tâche invalide (`INVALID_ID`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UserNotFound:
      description: Utilisateur introuvable (`USER_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TaskNotFound:
      description: Tâche introuvable (`TASK_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    EmailTaken:
      description: Un utilisateur avec cet email existe déjà (`EMAIL_TAKEN`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Corps de requête de plus de 1 MiB (`PAYLOAD_TOO_LARGE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Erreur interne (`INTERNAL_ERROR`) ; les détails techniques ne sont pas exposés
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
