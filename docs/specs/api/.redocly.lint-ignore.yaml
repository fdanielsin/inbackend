# GET et HEAD de /health, /ready, /openapi.yaml, /docs, /users et /stats n'ont ni paramètre ni corps :
# elles ne peuvent renvoyer aucune 4xx, et en déclarer une serait inexact.
# Toute nouvelle opération sans 4xx doit rester signalée par la règle.
openapi.yaml:
  operation-4xx-response:
    - '#/paths/~1health/get/responses'
    - '#/paths/~1ready/get/responses'
    - '#/paths/~1api~1v1~1users/get/responses'
    - '#/paths/~1api~1v1~1stats/get/responses'
    - '#/paths/~1openapi.yaml/get/responses'
    - '#/paths/~1docs/get/responses'
    - '#/paths/~1health/head/responses'
    - '#/paths/~1api~1v1~1users/head/responses'
    - '#/paths/~1api~1v1~1stats/head/responses'
    - '#/paths/~1openapi.yaml/head/responses'
    - '#/paths/~1docs/head/responses'
    - '#/paths/~1ready/head/responses'
